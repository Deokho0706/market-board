name: Daily Seed Data Update

on:
  schedule:
    # 매일 KST 08:00 (UTC 23:00 전날) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  update-seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run seed updater
        run: node scripts/update-seed.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/seed.json
          git diff --staged --quiet && echo "변경 없음" || (
            git commit -m "chore: daily seed update $(TZ=Asia/Seoul date '+%Y-%m-%d')"
            git push
          )
