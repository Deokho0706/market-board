<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마켓 확률 보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #111318;
      --border: #1e2229;
      --border2: #2a3040;
      --text: #c8d0dc;
      /* FIX: #566070 → #8a96a8 — 대비비 4.5:1 이상 확보 (WCAG AA) */
      --muted: #8a96a8;
      --accent: #00d4aa;
      --green: #22c55e;
      --red: #f43f5e;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #a78bfa;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .logo span {
      color: var(--accent);
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* FIX: 라이브 도트를 amber(경고색)에서 muted 점으로 변경 — "수동 갱신 모드"인데 pulsing live 도트는 오해 유발 */
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .ts {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .ts #ts-val {
      color: var(--text);
    }

    /* FIX: .btn-reload에 id 없이 쓰던 인라인 style 제거 → .section-ctrl 클래스로 통일 */
    .section-ctrl {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-reload {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
      transition: all .15s;
      letter-spacing: 0.06em;
    }

    .btn-reload:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* FIX: .loading 상태에서 pointer-events:none + opacity 로 중복 클릭 완전 차단 */
    .btn-reload.loading {
      opacity: .45;
      pointer-events: none;
    }

    .btn-reload svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    /* FIX: spinning 클래스를 버튼 자체가 아닌 SVG에 적용하도록 변경 → 텍스트는 고정 */
    .btn-reload.spinning svg {
      animation: spin .6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* ── SECTION HEADER ── */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 32px 0 14px;
      gap: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .section-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    .section-ts {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    /* FIX: 캐시 히트 시 표시 스타일 */
    .section-ts.cached {
      color: var(--amber);
    }

    /* ── MARKET CARDS ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }

    .mcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      transition: border-color .15s;
    }

    .mcard:hover {
      border-color: var(--border2);
    }

    .mcard::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .mcard.up::after {
      background: var(--green);
    }

    .mcard.down::after {
      background: var(--red);
    }

    .mcard.neutral::after {
      background: var(--muted);
    }

    .mcard-label {
      font-size: 10px;
      color: #b0bcc8;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-family: var(--mono);
      text-transform: uppercase;
    }

    .mcard-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      line-height: 1;
      margin-bottom: 6px;
    }

    .mcard-change {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
    }

    .mcard-change.up {
      color: var(--green);
    }

    .mcard-change.down {
      color: var(--red);
    }

    .mcard-change.neutral {
      color: var(--muted);
    }

    .mcard-sub {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── PROBABILITY CARDS ── */
    .prob-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .pcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px 20px;
      transition: border-color .15s;
    }

    .pcard:hover {
      border-color: var(--border2);
    }

    .pcard-type {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .pcard-type.binary {
      color: var(--blue);
    }

    .pcard-type.multi {
      color: var(--purple);
    }

    .pcard-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e8f0;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* Binary card */
    .binary-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }

    .binary-yes-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
    }

    .binary-yes-pct {
      font-family: var(--mono);
      font-size: 32px;
      font-weight: 600;
      color: var(--green);
      line-height: 1;
    }

    .binary-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px 0 8px;
      overflow: hidden;
    }

    .binary-bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      /* FIX: 초기 width=0, JS에서 rAF로 실제 값 적용 → transition 정상 작동 */
      width: 0;
      transition: width .6s ease;
    }

    .binary-no {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .binary-no span {
      color: var(--red);
    }

    /* Multi card */
    .multi-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .multi-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .multi-row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .multi-row-label {
      font-size: 12px;
      color: var(--text);
    }

    .multi-row-pct {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--purple);
    }

    .multi-row-pct.top {
      color: var(--accent);
    }

    .multi-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .multi-bar-fill {
      height: 100%;
      background: var(--purple);
      border-radius: 2px;
      /* FIX: 초기 width=0 — rAF로 실제 값 적용 */
      width: 0;
      transition: width .6s ease;
    }

    .multi-bar-fill.top {
      background: var(--accent);
    }

    .multi-other {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }

    .pcard-src {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      margin-top: 14px;
      letter-spacing: 0.06em;
    }

    /* ── NEWS CARDS ── */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    .ncard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .15s;
    }

    .ncard:hover {
      border-color: var(--border2);
    }

    .ncard-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 3px;
      width: fit-content;
    }

    .ncard-tag.fed {
      background: #1e2a3a;
      color: var(--blue);
    }

    .ncard-tag.macro {
      background: #1e2a20;
      color: var(--green);
    }

    .ncard-tag.risk {
      background: #2a1e1e;
      color: var(--red);
    }

    .ncard-tag.policy {
      background: #2a261e;
      color: var(--amber);
    }

    .ncard-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e8f0;
      line-height: 1.5;
    }

    /* FIX: muted 텍스트 가독성 — summary는 --text의 약간 더 밝게 */
    .ncard-summary {
      font-size: 12px;
      color: var(--text);
      line-height: 1.7;
      opacity: 0.75;
    }

    /* FIX: why 텍스트에서 "→" 하드코딩 제거 → ::before 가상 요소로 처리 */
    .ncard-why {
      font-size: 11px;
      color: var(--accent);
      line-height: 1.5;
      padding-left: 10px;
      border-left: 2px solid var(--accent);
    }

    .ncard-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .ncard-date {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    /* ── CHARTS ── */
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 10px;
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
    }

    .chart-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .chart-card-title {
      font-size: 13px;
      font-weight: 500;
      color: #e0e8f0;
    }

    .chart-card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-family: var(--mono);
    }

    .chart-tabs {
      display: flex;
      gap: 4px;
    }

    .chart-tab {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      transition: all .12s;
    }

    .chart-tab.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .chart-wrap {
      position: relative;
      height: 180px;
    }

    /* ── DISCLAIMER ── */
    .disclaimer {
      margin-top: 40px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.7;
      font-family: var(--mono);
    }

    .disclaimer strong {
      color: var(--amber);
    }

    /* ── SKELETON ── */
    /* FIX: skeleton을 실제로 사용 */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--border2) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 3px;
      height: 80px;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    .fade-in {
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (max-width: 600px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .prob-grid,
      .news-grid,
      .chart-grid {
        grid-template-columns: 1fr;
      }

      .binary-yes-pct {
        font-size: 26px;
      }

      .header-meta {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- HEADER -->
    <header>
      <div class="logo">MARKET<span>·</span>BOARD</div>
      <div class="header-meta">
        <div class="live-badge">
          <div class="live-dot"></div>
          수동 갱신 모드
        </div>
        <div class="ts">마지막 갱신: <span id="ts-val">—</span></div>
        <button class="btn-reload" id="btn-all" onclick="reloadAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          전체 새로고침
        </button>
      </div>
    </header>

    <!-- SECTION A: MARKET -->
    <div class="section-head">
      <div class="section-title">시장 지표</div>
      <!-- FIX: .section-ctrl 클래스로 인라인 스타일 제거 -->
      <div class="section-ctrl">
        <span class="section-ts" id="ts-market">—</span>
        <!-- FIX: 각 버튼에 id 부여 → JS에서 스피너 상태 관리 가능 -->
        <button class="btn-reload" id="btn-market" onclick="reloadSection('market')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          갱신
        </button>
      </div>
    </div>
    <div class="cards-grid" id="market-grid"></div>

    <!-- SECTION B: PROBABILITY -->
    <div class="section-head">
      <div class="section-title">시장 암시 확률</div>
      <div class="section-ctrl">
        <span class="section-ts" id="ts-prob">—</span>
        <button class="btn-reload" id="btn-prob" onclick="reloadSection('prob')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          갱신
        </button>
      </div>
    </div>
    <div class="prob-grid" id="prob-grid"></div>

    <!-- SECTION C: NEWS -->
    <div class="section-head">
      <div class="section-title">핵심 사건 / 이슈</div>
      <div class="section-ctrl">
        <span class="section-ts" id="ts-news">—</span>
        <button class="btn-reload" id="btn-news" onclick="reloadSection('news')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          갱신
        </button>
      </div>
    </div>
    <div class="news-grid" id="news-grid"></div>

    <!-- SECTION D: CHARTS -->
    <div class="section-head">
      <div class="section-title">주요 차트</div>
      <!-- FIX: 차트 섹션에도 타임스탬프 + 갱신 버튼 추가 -->
      <div class="section-ctrl">
        <span class="section-ts" id="ts-chart">—</span>
        <button class="btn-reload" id="btn-chart" onclick="reloadCharts()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
          갱신
        </button>
      </div>
    </div>
    <div class="chart-grid" id="chart-grid"></div>

    <!-- DISCLAIMER -->
    <div class="disclaimer">
      <strong>⚠ 유의사항</strong> · 이 대시보드는 시장 모니터링 참고용이며 투자 권유가 아닙니다.
      확률 수치는 예측시장(Polymarket · CME FedWatch)의 <strong>시장 암시 확률</strong>이며 실제 결과를 보장하지 않습니다.
      현재 표시된 데이터는 <strong>목업(Mock) 데이터</strong>입니다 — API 연동 전입니다.
    </div>

  </div>

  <script>
    // ────────── DATA STORAGE ──────────
    let MOCK_MARKET = [];
    let MOCK_PROB = [];
    let MOCK_NEWS = [];

    // ────────── CHART DATA ──────────
    function genSP500(days) {
      const labels = [], data = []; let v = 100;
      const now = new Date();
      for (let i = days; i >= 0; i--) {
        const dt = new Date(now);
        dt.setDate(dt.getDate() - i);
        labels.push(`${dt.getMonth() + 1}/${dt.getDate()}`);
        v += (Math.random() - 0.47) * 1.2;
        data.push(+v.toFixed(2));
      }
      return { labels, data };
    }

    function genVIX(days) {
      const labels = [], data = []; let v = 22;
      const now = new Date();
      for (let i = days; i >= 0; i--) {
        const dt = new Date(now);
        dt.setDate(dt.getDate() - i);
        labels.push(`${dt.getMonth() + 1}/${dt.getDate()}`);
        v += (Math.random() - 0.5) * 1.5;
        v = Math.max(12, Math.min(40, v));
        data.push(+v.toFixed(2));
      }
      return { labels, data };
    }

    // ────────── UTILS ──────────
    function fmtTs(d) {
      return d.toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    // FIX: 버튼 스피너 상태를 한 곳에서 관리하는 헬퍼 함수
    function setBtnState(id, loading) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.classList.toggle('spinning', loading);
      btn.classList.toggle('loading', loading);
    }

    // FIX: 캐시 히트 여부를 타임스탬프 표시에 반영
    function setTs(id, d, fromCache) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = fromCache ? `${fmtTs(d)} (캐시)` : fmtTs(d);
      el.classList.toggle('cached', !!fromCache);
    }

    // FIX: 프로그레스바 transition을 실제로 작동시키는 애니메이션 헬퍼
    // innerHTML 교체 직후에는 브라우저가 레이아웃을 계산하기 전이라 transition이 안 걸림
    // rAF 두 번 돌려서 브라우저가 초기 width:0을 "그린 뒤" 목표값으로 전환
    function animateBars(container) {
      const fills = container.querySelectorAll('.binary-bar-fill, .multi-bar-fill');
      fills.forEach(el => {
        const target = el.dataset.pct + '%';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { el.style.width = target; });
        });
      });
    }

    // FIX: skeleton 렌더 — 로딩 중 빈 화면 대신 shimmer 플레이스홀더 표시
    function showSkeleton(gridId, count) {
      const g = document.getElementById(gridId);
      g.innerHTML = Array.from({ length: count }, () =>
        `<div class="skeleton"></div>`
      ).join('');
    }

    // ────────── RENDER ──────────
    function renderMarket() {
      const g = document.getElementById('market-grid');
      g.innerHTML = '';
      MOCK_MARKET.forEach(item => {
        const cls = item.raw > 0 ? 'up' : item.raw < 0 ? 'down' : 'neutral';
        const chg = item.change
          ? `<div class="mcard-change ${cls}">${item.change}</div>` : '';
        const d = document.createElement('div');
        d.className = `mcard ${cls} fade-in`;
        d.innerHTML = `
      <div class="mcard-label">${item.label}</div>
      <div class="mcard-value">${item.value}</div>
      ${chg}
      <div class="mcard-sub">${item.sub}</div>`;
        g.appendChild(d);
      });
    }

    function renderProb() {
      const g = document.getElementById('prob-grid');
      g.innerHTML = '';
      MOCK_PROB.forEach(item => {
        const d = document.createElement('div');
        d.className = 'pcard fade-in';
        if (item.type === 'binary') {
          // FIX: data-pct 속성으로 목표값 저장 → animateBars()가 읽어서 transition 적용
          d.innerHTML = `
        <div class="pcard-type binary">BINARY</div>
        <div class="pcard-title">${item.title}</div>
        <div class="binary-main">
          <span class="binary-yes-label">Yes</span>
          <span class="binary-yes-pct">${item.yes}%</span>
        </div>
        <div class="binary-bar">
          <div class="binary-bar-fill" data-pct="${item.yes}"></div>
        </div>
        <div class="binary-no">No <span>${item.no}%</span></div>
        <div class="pcard-src">${item.src}</div>`;
        } else {
          const rows = item.outcomes.map((o, i) => `
        <div class="multi-row">
          <div class="multi-row-head">
            <span class="multi-row-label">${o.label}</span>
            <span class="multi-row-pct ${i === 0 ? 'top' : ''}">${o.pct}%</span>
          </div>
          <div class="multi-bar">
            <div class="multi-bar-fill ${i === 0 ? 'top' : ''}" data-pct="${o.pct}"></div>
          </div>
        </div>`).join('');
          d.innerHTML = `
        <div class="pcard-type multi">MULTI-OUTCOME</div>
        <div class="pcard-title">${item.title}</div>
        <div class="multi-rows">${rows}</div>
        <div class="multi-other">기타 ${item.other}% (나머지 아웃컴)</div>
        <div class="pcard-src">${item.src}</div>`;
        }
        g.appendChild(d);
      });
      // FIX: 렌더 직후 animateBars 호출
      animateBars(g);
    }

    function renderNews() {
      const g = document.getElementById('news-grid');
      g.innerHTML = '';
      MOCK_NEWS.forEach(item => {
        const d = document.createElement('div');
        d.className = 'ncard fade-in';
        d.innerHTML = `
      <span class="ncard-tag ${item.tag}">${item.tagLabel}</span>
      <div class="ncard-title">${item.title}</div>
      <div class="ncard-summary">${item.summary}</div>
      <div class="ncard-why">${item.why}</div>
      <div class="ncard-meta">
        <span class="ncard-date">${item.date}</span>
      </div>`;
        g.appendChild(d);
      });
    }

    // ────────── CHARTS ──────────
    // FIX: Chart 인스턴스를 전역 객체로 관리 — buildCharts가 여러 번 호출돼도 안전하게 destroy
    const charts = {};

    function chartOpts() {
      return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#111318',
            borderColor: '#2a3040', borderWidth: 1,
            titleColor: '#8a96a8', bodyColor: '#c8d0dc',
            titleFont: { family: 'IBM Plex Mono', size: 10 },
            bodyFont: { family: 'IBM Plex Mono', size: 11 },
          }
        },
        scales: {
          x: {
            ticks: { color: '#8a96a8', font: { family: 'IBM Plex Mono', size: 10 }, maxTicksLimit: 6, maxRotation: 0 },
            grid: { color: '#1e2229' }
          },
          y: {
            ticks: { color: '#8a96a8', font: { family: 'IBM Plex Mono', size: 10 } },
            grid: { color: '#1e2229' }
          }
        }
      };
    }

    function drawSP(days) {
      const { labels, data } = genSP500(days);
      const canvas = document.getElementById('chart-sp');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      // FIX: destroy 먼저, 그 다음 새 차트 생성
      if (charts.sp) { charts.sp.destroy(); charts.sp = null; }
      const grad = ctx.createLinearGradient(0, 0, 0, 180);
      grad.addColorStop(0, 'rgba(0,212,170,0.18)');
      grad.addColorStop(1, 'rgba(0,212,170,0)');
      charts.sp = new Chart(ctx, {
        type: 'line',
        data: {
          labels, datasets: [{
            data, borderColor: '#00d4aa', borderWidth: 1.5,
            backgroundColor: grad, fill: true, tension: 0.3, pointRadius: 0, pointHoverRadius: 4,
            pointHoverBackgroundColor: '#00d4aa'
          }]
        },
        options: chartOpts()
      });
    }

    function drawVIX(days) {
      const { labels, data } = genVIX(days);
      const canvas = document.getElementById('chart-vix');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (charts.vix) { charts.vix.destroy(); charts.vix = null; }
      const grad = ctx.createLinearGradient(0, 0, 0, 180);
      grad.addColorStop(0, 'rgba(244,63,94,0.15)');
      grad.addColorStop(1, 'rgba(244,63,94,0)');
      charts.vix = new Chart(ctx, {
        type: 'line',
        data: {
          labels, datasets: [{
            data, borderColor: '#f43f5e', borderWidth: 1.5,
            backgroundColor: grad, fill: true, tension: 0.3, pointRadius: 0, pointHoverRadius: 4,
            pointHoverBackgroundColor: '#f43f5e'
          }]
        },
        // FIX: 원본 코드의 annotation spread 패턴은 plugins를 덮어씌워 tooltip이 손실됨 → chartOpts() 직접 사용
        options: chartOpts()
      });
    }

    function switchTab(btn, chartKey, days) {
      btn.closest('.chart-tabs')
        .querySelectorAll('.chart-tab')
        .forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (chartKey === 'sp') drawSP(days);
      if (chartKey === 'vix') drawVIX(days);
    }

    // FIX: 차트 DOM을 매번 재생성하지 않고, 최초 1회만 구조 빌드 → 이후 drawSP/drawVIX만 호출
    let chartsBuilt = false;
    function buildCharts() {
      const g = document.getElementById('chart-grid');
      if (!chartsBuilt) {
        g.innerHTML = `
      <div class="chart-card fade-in">
        <div class="chart-card-head">
          <div>
            <div class="chart-card-title">S&P 500 추이</div>
            <div class="chart-card-sub">^GSPC · 상대지수(기준=100)</div>
          </div>
          <div class="chart-tabs">
            <button class="chart-tab active" onclick="switchTab(this,'sp',30)">1M</button>
            <button class="chart-tab" onclick="switchTab(this,'sp',90)">3M</button>
            <button class="chart-tab" onclick="switchTab(this,'sp',365)">1Y</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="chart-sp"></canvas></div>
      </div>
      <div class="chart-card fade-in">
        <div class="chart-card-head">
          <div>
            <div class="chart-card-title">VIX 변동성 지수</div>
            <div class="chart-card-sub">CBOE · 20↑ 경계 · 30↑ 위험</div>
          </div>
          <div class="chart-tabs">
            <button class="chart-tab active" onclick="switchTab(this,'vix',30)">1M</button>
            <button class="chart-tab" onclick="switchTab(this,'vix',90)">3M</button>
            <button class="chart-tab" onclick="switchTab(this,'vix',365)">1Y</button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="chart-vix"></canvas></div>
      </div>`;
        chartsBuilt = true;
      }
      drawSP(30);
      drawVIX(30);
    }

    // ────────── CACHE & RELOAD ──────────
    const CACHE = {};
    const CACHE_TTL = { market: 90000, prob: 900000, news: 1800000 }; // ms

    // FIX: simulateFetch 대신 실제 fetch 연동
    // FIX: simulateFetch 대신 실제 fetch 연동
    async function simulateFetch(section) {
      try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();

        let apiData = null;
        try {
          const apiRes = await fetch('/api/dashboard');
          if (apiRes.ok) apiData = await apiRes.json();
        } catch(err) {
          console.error('API error:', err);
        }
        
        if (section === 'market' || !section) {
          MOCK_MARKET = data.market || [];
          if (apiData) {
            const updateFredItem = (label, value) => {
              const idx = MOCK_MARKET.findIndex(m => m.label === label);
              if (idx > -1) {
                MOCK_MARKET[idx].value = value + "%";
                MOCK_MARKET[idx].change = "LIVE";
                MOCK_MARKET[idx].sub = "FRED 실시간";
                MOCK_MARKET[idx].raw = 0; // neutral class
              } else {
                MOCK_MARKET.push({
                  label, value: value + "%", change: "LIVE", raw: 0, sub: "FRED 실시간"
                });
              }
            };
            updateFredItem("미국 10Y", apiData.us10y);
            updateFredItem("장단기금리차", apiData.spread);
            updateFredItem("연준 기준금리", apiData.fedfunds);

            const updateYahooItem = (label, yData) => {
              if (!yData) return;
              const idx = MOCK_MARKET.findIndex(m => m.label === label);
              if (idx > -1) {
                MOCK_MARKET[idx].value = yData.price;
                MOCK_MARKET[idx].change = yData.change;
                MOCK_MARKET[idx].raw = yData.raw;
                if (!MOCK_MARKET[idx].sub.includes('LIVE')) {
                  // sub 라벨 텍스트에 LIVE 추가
                  MOCK_MARKET[idx].sub += " · LIVE";
                }
              }
            };

            if (apiData.market) {
              updateYahooItem("S&P 500", apiData.market.sp500);
              updateYahooItem("NASDAQ", apiData.market.nasdaq);
              updateYahooItem("VIX", apiData.market.vix);
              updateYahooItem("달러인덱스", apiData.market.dxy);
              updateYahooItem("달러/원", apiData.market.krw);
              updateYahooItem("WTI 원유", apiData.market.wti);
              updateYahooItem("금", apiData.market.gold);
            }
          }
        }
        if (section === 'prob' || !section) {
          MOCK_PROB = data.probability || [];
          if (apiData && apiData.polymarket) {
            const recIdx = MOCK_PROB.findIndex(p => p.title.includes('경기침체 진입') || p.title.includes('경기침체'));
            if (recIdx > -1) {
              MOCK_PROB[recIdx].yes = apiData.polymarket.recession.yes;
              MOCK_PROB[recIdx].no = apiData.polymarket.recession.no;
              MOCK_PROB[recIdx].src = "Polymarket · LIVE";
            }

            const fedIdx = MOCK_PROB.findIndex(p => p.title.includes('금리 인하 횟수') || p.title.includes('기준금리 수준'));
            const fedObj = {
              type: "multi",
              title: "연준 2026년 금리 인하 횟수",
              outcomes: [
                { label: "0회 (동결)", pct: apiData.polymarket.fed_cuts_2026.zero },
                { label: "1회 (25bp)", pct: apiData.polymarket.fed_cuts_2026.one },
                { label: "2회 (50bp)", pct: apiData.polymarket.fed_cuts_2026.two }
              ],
              other: Math.max(0, 100 - (apiData.polymarket.fed_cuts_2026.zero + apiData.polymarket.fed_cuts_2026.one + apiData.polymarket.fed_cuts_2026.two)),
              src: "Polymarket · LIVE"
            };

            if (fedIdx > -1) {
              MOCK_PROB[fedIdx] = fedObj;
            } else {
               MOCK_PROB.push(fedObj);
            }
          }
        }
        if (section === 'news' || !section) MOCK_NEWS = data.news || [];
      } catch (e) {
        console.error('Data fetch error:', e);
      }
    }

    // FIX: 섹션별 reload — 스피너 상태 관리 + 캐시 히트 구분 + 타임스탬프 정확성
    async function reloadSection(section) {
      const now = Date.now();
      const fromCache = CACHE[section] && (now - CACHE[section] < CACHE_TTL[section]);

      if (fromCache) {
        // 캐시 히트: 데이터는 그대로, 타임스탬프에 "(캐시)" 표시
        setTs(`ts-${section}`, new Date(CACHE[section]), true);
        return;
      }

      const btnId = `btn-${section}`;
      setBtnState(btnId, true);
      // FIX: 스켈레톤 표시
      const skeletonCount = section === 'market' ? 10 : section === 'prob' ? 6 : 6;
      showSkeleton(`${section}-grid`, skeletonCount);

      try {
        await simulateFetch(section);
        // FIX: fetch 완료 이후에 캐시 타임스탬프 기록 (원본은 fetch 전에 기록)
        CACHE[section] = Date.now();
        if (section === 'market') renderMarket();
        if (section === 'prob') renderProb();
        if (section === 'news') renderNews();
        setTs(`ts-${section}`, new Date(CACHE[section]), false);
      } finally {
        setBtnState(btnId, false);
      }
    }

    // FIX: 차트 전용 reload
    async function reloadCharts() {
      setBtnState('btn-chart', true);
      await new Promise(r => setTimeout(r, 300));
      buildCharts();
      const now = new Date();
      setTs('ts-chart', now, false);
      setBtnState('btn-chart', false);
    }

    // FIX: reloadAll — 경쟁 조건 수정 + 모든 섹션 스피너 통합 처리
    async function reloadAll() {
      const btnAll = document.getElementById('btn-all');
      btnAll.classList.add('spinning', 'loading');

      ['market', 'prob', 'news'].forEach(s => {
        setBtnState(`btn-${s}`, true);
        const count = s === 'market' ? 10 : 6;
        showSkeleton(`${s}-grid`, count);
      });

      // FIX: 각 섹션 캐시를 무효화 후 병렬 fetch
      CACHE.market = CACHE.prob = CACHE.news = 0;

      await Promise.all([
        simulateFetch('market'),
        simulateFetch('prob'),
        simulateFetch('news'),
      ]);

      // FIX: fetch 완료 후 타임스탬프 기록
      const now = Date.now();
      CACHE.market = CACHE.prob = CACHE.news = now;

      renderMarket();
      renderProb();
      renderNews();
      buildCharts();

      const d = new Date(now);
      ['market', 'prob', 'news'].forEach(s => {
        setTs(`ts-${s}`, d, false);
        setBtnState(`btn-${s}`, false);
      });
      setTs('ts-chart', d, false);
      document.getElementById('ts-val').textContent = fmtTs(d);

      btnAll.classList.remove('spinning', 'loading');
    }

    // ────────── INIT ──────────
    (async () => {
      ['market', 'prob', 'news'].forEach(s => {
        setBtnState(`btn-${s}`, true);
        showSkeleton(`${s}-grid`, s === 'market' ? 10 : 6);
      });
      setBtnState('btn-chart', true);

      await Promise.all([
        simulateFetch('market'),
        simulateFetch('prob'),
        simulateFetch('news'),
      ]);

      const now = Date.now();
      CACHE.market = CACHE.prob = CACHE.news = now;

      renderMarket();
      renderProb();
      renderNews();
      buildCharts();

      const d = new Date(now);
      ['market', 'prob', 'news'].forEach(s => {
        setTs(`ts-${s}`, d, false);
        setBtnState(`btn-${s}`, false);
      });
      setTs('ts-chart', d, false);
      document.getElementById('ts-val').textContent = fmtTs(d);
    })();
  </script>
</body>

</html>
